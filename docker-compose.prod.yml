services:
  db:
    image: postgres:16-alpine
    container_name: mj_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mercado_juegos_db}
      POSTGRES_USER: ${DB_USER:-mercado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mj_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - mj_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mercado_user} -d ${DB_NAME:-mercado_juegos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: mj_web_prod
    restart: always
    command: gunicorn mercado_juegos.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    env_file:
      - .env.prod
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mj_prod_net

networks:
  mj_prod_net:
    driver: bridge

volumes:
  mj_postgres_prod_data: